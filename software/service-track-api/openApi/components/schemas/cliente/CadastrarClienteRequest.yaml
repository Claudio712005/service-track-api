type: object
description: Dados necessários para cadastrar um novo cliente.
required:
  - nome
  - email
  - senha
  - dataNascimento
  - telefone
  - cpf
properties:
  nome:
    type: string
    minLength: 2
    description: Nome completo do cliente.
    example: "Cláudio da Silva Araújo"
  email:
    type: string
    format: email
    description: E-mail único do cliente, usado para login.
    example: "claudio@email.com"
  senha:
    type: string
    format: password
    minLength: 6
    description: Senha de acesso. Deve atender à política de senha.
    example: "Senha@123"
  dataNascimento:
    type: string
    format: date
    description: Data de nascimento no formato ISO 8601 (AAAA-MM-DD).
    example: "1990-01-15"
  telefone:
    type: string
    minLength: 10
    maxLength: 11
    description: Telefone de contato (somente dígitos, com DDD).
    example: "11987654321"
  cpf:
    type: string
    minLength: 11
    maxLength: 14
    description: CPF do cliente, com ou sem máscara.
    example: "54927170063"
