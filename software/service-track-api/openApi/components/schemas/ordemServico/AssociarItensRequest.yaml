type: object
description: |
  Serviços e insumos a associar à OS durante o diagnóstico.
  Substitui atomicamente todos os itens já associados. Requer no mínimo 1 serviço e 1 insumo.
required:
  - servicos
  - insumos
properties:
  servicos:
    type: array
    minItems: 1
    description: Serviços diagnosticados para a OS.
    items:
      type: object
      required:
        - servicoId
      properties:
        servicoId:
          type: string
          format: uuid
          description: ID do serviço do catálogo.
          example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        valorCobrado:
          type: number
          format: double
          description: Valor cobrado; se omitido, usa o valorReferência do catálogo.
          example: 150.00
  insumos:
    type: array
    minItems: 1
    description: Insumos/peças diagnosticados para a OS.
    items:
      type: object
      required:
        - insumoId
        - quantidade
      properties:
        insumoId:
          type: string
          format: uuid
          description: ID do insumo do catálogo.
          example: "9f1c2d3e-4b5a-6c7d-8e9f-0a1b2c3d4e5f"
        quantidade:
          type: integer
          minimum: 1
          description: Quantidade a utilizar.
          example: 2
