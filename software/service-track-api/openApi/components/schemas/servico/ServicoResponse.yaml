type: object
description: Representação de um serviço do catálogo.
properties:
  id:
    type: string
    format: uuid
    description: Identificador único do serviço.
    example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
  nomeServico:
    type: string
    description: Nome do serviço.
    example: "Troca de Óleo"
  descricaoServico:
    type: string
    description: Descrição do serviço.
    example: "Substituição do óleo do motor e filtro"
  valorReferencia:
    type: number
    format: double
    description: Valor de referência cobrado pelo serviço.
    example: 150.00
