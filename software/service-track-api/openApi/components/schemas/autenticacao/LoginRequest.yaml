type: object
description: Credenciais de acesso para autenticação do usuário.
required:
  - email
  - senha
properties:
  email:
    type: string
    format: email
    description: E-mail cadastrado do usuário.
    example: "clausilvaaraujo11@gmail.com"
  senha:
    type: string
    format: password
    minLength: 6
    description: Senha de acesso do usuário.
    example: "Senha@123"
