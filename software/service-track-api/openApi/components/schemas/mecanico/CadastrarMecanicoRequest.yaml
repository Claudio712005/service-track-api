type: object
description: Dados necessários para cadastrar um novo mecânico.
required:
  - nome
  - email
  - senha
  - dataNascimento
  - telefone
  - cpf
  - nivel
  - valorHora
properties:
  nome:
    type: string
    minLength: 2
    description: Nome completo do mecânico.
    example: "João da Silva"
  email:
    type: string
    format: email
    description: E-mail único do mecânico, usado para login.
    example: "joao@mecanica.com"
  senha:
    type: string
    format: password
    minLength: 6
    description: Senha de acesso. Deve atender à política de senha.
    example: "Senha@123"
  dataNascimento:
    type: string
    format: date
    description: Data de nascimento no formato ISO 8601 (AAAA-MM-DD).
    example: "1985-03-20"
  telefone:
    type: string
    minLength: 10
    maxLength: 11
    description: Telefone de contato (somente dígitos, com DDD).
    example: "11987654321"
  cpf:
    type: string
    minLength: 11
    maxLength: 14
    description: CPF do mecânico, com ou sem máscara.
    example: "54927170063"
  nivel:
    type: string
    enum:
      - JUNIOR
      - PLENO
      - SENIOR
    description: Nível de senioridade do mecânico.
    example: "JUNIOR"
  valorHora:
    type: number
    format: double
    minimum: 0.01
    description: Valor cobrado por hora de trabalho do mecânico.
    example: 50.00
