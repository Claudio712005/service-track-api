quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${APP_DB_USER:app_user}
quarkus.datasource.password=${APP_DB_PASSWORD:app_user}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/servicetrack}

# O tamanho do pool e orcamento de banco, nao ajuste local: o teto de conexoes do
# PostgreSQL e dividido entre as replicas do HPA e a Lambda de autenticacao. O valor
# vem do ConfigMap service-track-db, alimentado pelo SSM que o repositorio
# service-track-db-infra publica. Ver DB-ADR-004.
#
# Consumo por pod = max-size (principal) + max-size (migracao).
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:8}
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN_SIZE:1}
quarkus.datasource.jdbc.initial-size=${DB_POOL_INITIAL_SIZE:1}
quarkus.datasource.jdbc.acquisition-timeout=${DB_POOL_ACQUISITION_TIMEOUT:5S}
quarkus.datasource.jdbc.idle-removal-interval=${DB_POOL_IDLE_REMOVAL:2M}
quarkus.datasource.jdbc.max-lifetime=${DB_POOL_MAX_LIFETIME:30M}
quarkus.datasource.jdbc.background-validation-interval=${DB_POOL_VALIDATION_INTERVAL:1M}
quarkus.datasource.jdbc.leak-detection-interval=${DB_POOL_LEAK_DETECTION:5M}

quarkus.hibernate-orm.database.generation=validate

quarkus.datasource.migration.db-kind=postgresql
quarkus.datasource.migration.username=${FLYWAY_DB_USER:flyway_user}
quarkus.datasource.migration.password=${FLYWAY_DB_PASSWORD:flyway_user}
quarkus.datasource.migration.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/servicetrack}

# O Flyway so usa este datasource na subida. Mantido pequeno de proposito: cada
# replica reserva estas conexoes durante toda a vida do pod.
quarkus.datasource.migration.jdbc.max-size=${DB_POOL_MIGRATION_MAX_SIZE:2}
quarkus.datasource.migration.jdbc.min-size=0
quarkus.datasource.migration.jdbc.initial-size=0
quarkus.datasource.migration.jdbc.idle-removal-interval=1M

quarkus.flyway.migration.migrate-at-start=true
quarkus.flyway.migration.locations=classpath:db/migration
quarkus.flyway.migration.table=flyway_schema_history

quarkus.flyway.migrate-at-start=false

quarkus.mailer.host=${QUARKUS_MAILER_HOST:smtp.resend.com}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:587}
quarkus.mailer.username=${QUARKUS_MAILER_USERNAME:resend}
quarkus.mailer.password=${RESEND_API_KEY:}
quarkus.mailer.start-tls=${QUARKUS_MAILER_START_TLS:REQUIRED}
quarkus.mailer.auth-methods=${QUARKUS_MAILER_AUTH_METHODS:LOGIN PLAIN}
quarkus.mailer.from=${QUARKUS_MAILER_FROM:no-reply@clausilva.com.br}
