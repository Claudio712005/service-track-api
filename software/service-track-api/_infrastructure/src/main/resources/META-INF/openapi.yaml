        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Apenas o mecânico vinculado pode gerar o orçamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: OS não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
