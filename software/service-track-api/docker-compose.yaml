services:
  postgres:
    image: postgres:16-alpine
    container_name: servicetrack-postgres
    restart: unless-stopped
    networks:
      - servicetrack-network
    environment:
      POSTGRES_DB: servicetrack
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_DB_USER: ${FLYWAY_DB_USER}
      FLYWAY_DB_PASSWORD: ${FLYWAY_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d servicetrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicetrack-api
    restart: unless-stopped
    networks:
      - servicetrack-network
    environment:
      QUARKUS_PROFILE: prod
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      FLYWAY_DB_USER: ${FLYWAY_DB_USER}
      FLYWAY_DB_PASSWORD: ${FLYWAY_DB_PASSWORD}
      DB_JDBC_URL: ${POSTGRES_JDBC_URL}
      UNSPLASH_CHAVE_ACESSO: ${UNSPLASH_CHAVE_ACESSO}
      RESEND_API_KEY: ${RESEND_API_KEY}
      QUARKUS_MAILER_FROM: ${QUARKUS_MAILER_FROM:-no-reply@clausilva.com.br}
      SERVICETRACK_API_BASE_URL: ${SERVICETRACK_API_BASE_URL:-http://localhost:8080}
      # Observabilidade vendor-neutral (OpenTelemetry). Aponta para o coletor OTLP.
      # Sem o profile 'observability' ativo, os envios OTLP sao descartados e a
      # aplicacao roda normalmente (offline-friendly).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Profile 'observability' — stack local OpenTelemetry (100% offline).
  # Subir com: docker compose --profile observability up
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: servicetrack-otel-collector
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    networks:
      - servicetrack-network
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (traces/logs)
      - "4318:4318"   # OTLP HTTP (metrics)
      - "8889:8889"   # Prometheus exporter (scrape do Prometheus)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: servicetrack-jaeger
    restart: unless-stopped
    profiles: ["observability"]
    networks:
      - servicetrack-network
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI (traces)

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: servicetrack-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    networks:
      - servicetrack-network
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"     # Prometheus UI (metrics)

  grafana:
    image: grafana/grafana:11.2.0
    container_name: servicetrack-grafana
    restart: unless-stopped
    profiles: ["observability"]
    networks:
      - servicetrack-network
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"     # Grafana UI (dashboards)
    depends_on:
      - prometheus
      - jaeger

  # ---------------------------------------------------------------------------
  # Profile 'datadog' — PREPARACAO para producao. Nao sobe por padrao.
  # A aplicacao nao muda: basta apontar OTEL_EXPORTER_OTLP_ENDPOINT para o agente.
  # Subir com: docker compose --profile datadog up   (exige DD_API_KEY)
  # ---------------------------------------------------------------------------
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: dd-agent
    restart: unless-stopped
    profiles: ["datadog"]
    networks:
      - servicetrack-network
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: servicetrack-local
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: "0.0.0.0:4317"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: "0.0.0.0:4318"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro

volumes:
  postgres_data:

networks:
  servicetrack-network:
    driver: bridge
