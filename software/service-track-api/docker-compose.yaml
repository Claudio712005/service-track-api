services:
  postgres:
    image: postgres:16.15-alpine
    container_name: servicetrack-postgres
    restart: unless-stopped
    networks:
      - servicetrack-network
    environment:
      POSTGRES_DB: servicetrack
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_DB_USER: ${FLYWAY_DB_USER}
      FLYWAY_DB_PASSWORD: ${FLYWAY_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d servicetrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicetrack-api
    restart: unless-stopped
    networks:
      - servicetrack-network
    environment:
      QUARKUS_PROFILE: prod
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      FLYWAY_DB_USER: ${FLYWAY_DB_USER}
      FLYWAY_DB_PASSWORD: ${FLYWAY_DB_PASSWORD}
      DB_JDBC_URL: ${POSTGRES_JDBC_URL}
      UNSPLASH_CHAVE_ACESSO: ${UNSPLASH_CHAVE_ACESSO}
      RESEND_API_KEY: ${RESEND_API_KEY}
      QUARKUS_MAILER_FROM: ${QUARKUS_MAILER_FROM:-no-reply@clausilva.com.br}
      SERVICETRACK_API_BASE_URL: ${SERVICETRACK_API_BASE_URL:-http://localhost:8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://coletor-otlp:4317}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://coletor-otlp:4318/v1/metrics}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
      OTEL_TRACES_ENABLED: "false"
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
      DD_ENV: ${OTEL_ENVIRONMENT:-local}
      DD_SERVICE: service-track-api
      DD_VERSION: ${APP_VERSION:-local}
      DD_LOGS_INJECTION: "true"
      DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"java","service":"service-track-api"}]'
      com.datadoghq.tags.env: ${OTEL_ENVIRONMENT:-local}
      com.datadoghq.tags.service: service-track-api
      com.datadoghq.tags.version: ${APP_VERSION:-local}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/q/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      datadog-agent:
        condition: service_started

  auth:
    image: ${AUTH_IMAGE:-servicetrack-auth:local}
    container_name: servicetrack-auth
    restart: unless-stopped
    networks:
      - servicetrack-network
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: servicetrack
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      DB_POOL_MAX_SIZE: ${AUTH_DB_POOL_MAX_SIZE:-2}
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
      DD_ENV: ${OTEL_ENVIRONMENT:-local}
      DD_SERVICE: service-track-auth
      DD_VERSION: ${APP_VERSION:-local}
      DD_LOGS_INJECTION: "true"
      DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"java","service":"service-track-auth"}]'
      com.datadoghq.tags.env: ${OTEL_ENVIRONMENT:-local}
      com.datadoghq.tags.service: service-track-auth
      com.datadoghq.tags.version: ${APP_VERSION:-local}
    ports:
      - "8081:8080"
    depends_on:
      api:
        condition: service_healthy

  datadog-agent:
    image: gcr.io/datadoghq/agent:7.82.3
    container_name: datadog-agent
    restart: unless-stopped
    networks:
      servicetrack-network:
        aliases:
          - coletor-otlp
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8126:8126"
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: servicetrack-local
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: "0.0.0.0:4317"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: "0.0.0.0:4318"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_ENV: ${OTEL_ENVIRONMENT:-local}
      DD_TAGS: "projeto:servicetrack"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:

networks:
  servicetrack-network:
    driver: bridge
